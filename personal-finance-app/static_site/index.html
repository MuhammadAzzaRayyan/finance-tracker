<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Finance Manager - Static</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
</head>
<body>
    <div class="container my-4">
        <div class="text-center mb-4">
            <h2>💰 Personal Finance Manager (Static)</h2>
            <p class="text-muted">Simpan data di browser menggunakan <strong>localStorage</strong>.</p>
        </div>

        <div class="row">
            <div class="col-md-5">
                <div class="card p-3 mb-3">
                    <h5>📝 Tambah Transaksi</h5>
                    <form id="txForm">
                        <div class="mb-2">
                            <input type="text" id="description" class="form-control" placeholder="Deskripsi / Merchant" required>
                        </div>
                        <div class="mb-2 d-flex gap-2">
                            <input type="number" id="amount" class="form-control" placeholder="Jumlah (Rp)" required>
                            <select id="type" class="form-select" style="max-width:150px">
                                <option value="expense">📉 Pengeluaran</option>
                                <option value="income">📈 Pemasukan</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <select id="category" class="form-select">
                                <option>Belanja</option>
                                <option>Makan & Minum</option>
                                <option>Transportasi</option>
                                <option>Pendidikan</option>
                                <option>Hiburan</option>
                                <option>Kesehatan</option>
                                <option>Tagihan</option>
                                <option selected>Lain-lain</option>
                            </select>
                        </div>
                        <div class="d-grid">
                            <button class="btn btn-primary" type="submit">Tambah</button>
                        </div>
                    </form>
                </div>

                <div class="card p-3 mb-3">
                    <h5>📷 Scan Struk (OCR)</h5>
                    <div class="mb-2">
                        <input type="file" id="receiptFile" accept="image/*" class="form-control mb-2">
                        <button id="scanBtn" class="btn btn-outline-secondary mb-2">Scan & Ekstrak</button>
                    </div>
                    <div class="mb-2">
                        <button id="openCamera" class="btn btn-sm btn-primary">Gunakan Kamera</button>
                        <button id="stopCamera" class="btn btn-sm btn-secondary" style="display:none">Hentikan Kamera</button>
                    </div>
                    <div id="cameraArea" style="display:none;margin-top:10px">
                        <video id="video" autoplay playsinline style="width:100%;border-radius:6px;background:#000"></video>
                        <div class="d-flex gap-2 mt-2">
                            <button id="captureBtn" class="btn btn-success">Ambil Foto</button>
                            <button id="retakeBtn" class="btn btn-outline-secondary" style="display:none">Ulang</button>
                        </div>
                    </div>
                    <canvas id="captureCanvas" style="display:none"></canvas>
                    <div id="ocrResult" style="white-space:pre-wrap;background:#f8f9fa;padding:8px;border-radius:6px;color:#000;display:none;margin-top:8px"></div>
                </div>

                <div class="card p-3">
                    <h5>🔄 Ekspor</h5>
                    <div class="d-grid gap-2">
                        <button id="exportCsv" class="btn btn-sm btn-success">Ekspor CSV</button>
                        <button id="clearAll" class="btn btn-sm btn-danger">Hapus Semua Data</button>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card p-3 mb-3">
                    <h5>Saldo & Ringkasan</h5>
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="h4" id="balance">Rp 0</div>
                            <div class="text-muted">Pemasukan: <span id="totalIncome">Rp 0</span> &nbsp; | &nbsp; Pengeluaran: <span id="totalExpense">Rp 0</span></div>
                        </div>
                        <canvas id="pieChart" style="max-width:220px"></canvas>
                    </div>
                </div>

                <div class="card p-3 mb-3">
                    <h5>Grafik Tren</h5>
                    <canvas id="lineChart" height="120"></canvas>
                </div>

                <div class="card p-3">
                    <h5>📋 Riwayat Transaksi</h5>
                    <div id="transactions"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
