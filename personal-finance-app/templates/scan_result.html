<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Scan - Personal Finance Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-4">
        <div class="card p-3">
            <h4>Hasil Scan</h4>
            <p>Periksa dan edit hasil sebelum menyimpan transaksi.</p>

            <div class="mb-3">
                <label class="form-label">Merchant (Deskripsi)</label>
                <input type="text" id="merchant" class="form-control" value="{{ merchant }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Tanggal (opsional)</label>
                <input type="text" id="date" class="form-control" value="{{ date }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Total (Rp)</label>
                <input type="text" id="total" class="form-control currency" value="{{ total }}">
            </div>

            <form action="/add_transaction" method="post">
                <input type="hidden" name="description" id="fdesc">
                <input type="hidden" name="amount" id="famount">
                <input type="hidden" name="type" value="expense">
                <input type="hidden" name="date" id="fdate">
                <input type="hidden" name="category" id="fcategory" value="Belanja">

                <div class="mb-3">
                    <label class="form-label">Kategori</label>
                    <select name="category" class="form-control">
                        {% for cat in categories %}
                        <option>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-success" onclick="syncFields()">Simpan Transaksi</button>
                <a href="/scan" class="btn btn-secondary">Kembali</a>
            </form>

            <hr>
            <h6>Raw OCR</h6>
            <pre style="white-space:pre-wrap;background:#f8f9fa;padding:10px;border-radius:6px;color:#000">{{ ocr_text }}</pre>
        </div>
    </div>

    <script>
        function syncFields(){
            document.getElementById('fdesc').value = document.getElementById('merchant').value;
            const totalEl = document.getElementById('total');
            const raw = totalEl.dataset.raw || totalEl.value.replace(/[^0-9\-]/g,'') || 0;
            document.getElementById('famount').value = raw;
            document.getElementById('fdate').value = document.getElementById('date').value || '';
            document.getElementById('fcategory').value = document.querySelector('select[name="category"]').value;
        }
        document.addEventListener('DOMContentLoaded', function(){
            // attach simple currency formatting for this page as well
            function formatValue(v){ if(!v) return ''; v = v.toString().replace(/[^0-9\-]/g,''); return 'Rp. ' + v.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
            function rawValue(v){ return v ? v.toString().replace(/[^0-9\-]/g,'') : ''; }
            const total = document.getElementById('total');
            if(total){
                total.addEventListener('input', function(){ const r = rawValue(this.value); this.dataset.raw = r; this.value = formatValue(r); });
                if(total.value){ total.dataset.raw = rawValue(total.value); total.value = formatValue(total.dataset.raw); }
            }
            document.querySelectorAll('form').forEach(function(form){ form.addEventListener('submit', function(){ document.querySelectorAll('input.currency').forEach(function(ci){ ci.value = ci.dataset.raw || rawValue(ci.value) || 0; }); }); });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
